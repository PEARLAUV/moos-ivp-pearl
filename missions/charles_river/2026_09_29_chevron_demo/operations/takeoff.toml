# Shared takeoff operation graph. Declared edges are allowed; every undeclared
# transition is rejected. Requester transitions report retained physical
# observations; only the authority commits the canonical phase and revision.

[operation]
name = "takeoff"
version = 5
initial = "REQUESTED"

[wire]
request_variable = "TAKEOFF_OPERATION_REQUEST"
status_variable = "TAKEOFF_OPERATION_COMMIT"

[states]
pending = [
  "REQUESTED", "DEFERRED", "ACCEPTED", "DEPARTING", "TAKING_OFF",
  "TAKEN_OFF", "ABORTING", "SETTLING_FAILURE",
]
success = ["COMPLETED"]
failure = ["REJECTED", "FAILED", "CANCELLED", "EXPIRED"]

[transitions.authority]
REQUESTED = ["DEFERRED", "ACCEPTED", "REJECTED"]
DEFERRED = ["ACCEPTED", "REJECTED"]
ACCEPTED = ["SETTLING_FAILURE"]
DEPARTING = ["SETTLING_FAILURE"]
TAKING_OFF = ["SETTLING_FAILURE"]
TAKEN_OFF = ["COMPLETED", "SETTLING_FAILURE"]
ABORTING = ["CANCELLED", "SETTLING_FAILURE"]
SETTLING_FAILURE = ["FAILED"]

# Observation skips are intentional: telemetry can advance physically while a
# previous proposal or commit is delayed. Cancellation first enters ABORTING;
# it is terminal only after the authority confirms a safe physical settlement.
[transitions.requester]
REQUESTED = ["ABORTING"]
DEFERRED = ["ABORTING"]
ACCEPTED = ["DEPARTING", "TAKING_OFF", "TAKEN_OFF", "ABORTING"]
DEPARTING = ["TAKING_OFF", "TAKEN_OFF", "ABORTING"]
TAKING_OFF = ["TAKEN_OFF"]

[transitions.protocol]
REQUESTED = ["EXPIRED"]
DEFERRED = ["EXPIRED"]

[admission]
when_unready = "defer"
when_busy = "reject"
max_defer_time = 30

[protocol]
replay_cache_size = 256
event_queue_size = 32
require_correlated_commands = true

[timing]
request_ttl = 180
request_republish_interval = 1
status_republish_interval = 1
lease_timeout = 3
readiness_max_age = 3
max_clock_skew = 2
terminal_republish_time = 120
